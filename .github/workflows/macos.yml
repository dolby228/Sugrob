name: macOS

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Bundle app
        run: ./scripts/bundle.sh

      - name: Zip app
        run: ditto -c -k --keepParent dist/Sugrob.app dist/Sugrob.zip

      - uses: actions/upload-artifact@v7
        with:
          name: Sugrob-app
          path: dist/Sugrob.zip
          if-no-files-found: error
